        .log-card {

                    </div>

</div>

<script>
// ==========================================
//  PROJECT NAHLA INARA LOGBOOK DATA
//  (Paste generated arrays here)
// ==========================================
   let LOGBOOK_ENTRIES = [
    {
        "url": "https://inara.cz/elite/cmdr-logbook-entry/440263/88047/",
        "img": "https://i.ibb.co/6R9GZkwx/294415x4710.jpg",
        "cmdr": "Lysander666",
        "title": "Week one: study of Hypi Bra EV-P d5-78 6a",
        "excerpt": "Initial transit logbook and orbital mechanics notes recorded during the Project Nahla open expedition.",
        "date": "3311-07-24"
    },
    {
        "url": "https://inara.cz/elite/cmdr-logbook-entry/373754/99332/",
        "img": "",
        "cmdr": "Danly049",
        "title": "Day 01: Beyond Pâte Sablée",
        "excerpt": "The first day of Operation Nahla Circumnavigation is officially complete.",
        "date": "3312-11-14"
    },
    {
        "url": "https://inara.cz/elite/cmdr-logbook-entry/373754/99375/",
        "img": "",
        "cmdr": "Danly049",
        "title": "Day 02: Across Nahla's Golden Expanse",
        "excerpt": "The second day of Operation Nahla Circumnavigation is officially complete.",
        "date": "3312-11-17"
    },
    {
        "url": "https://inara.cz/elite/cmdr-logbook-entry/398319/99376/",
        "img": "",
        "cmdr": "Serani Mori",
        "title": "Searching for a Star",
        "excerpt": "This is a short story I wrote about tracking down a mystery star in the sky, a puzzle posed by CMDR Lysander666, as part of the larger Nahla Open Transit Voyage.",
        "date": "3312-11-17"
    }
];


let adminWorkingList = [];

function parseDateNum(str) {
    if (!str) return 0;
    const clean = str.toString().replace(/[^0-9]/g, '');
    return parseInt(clean, 10) || 0;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function refreshCmdrFilterDropdown() {
    const select = document.getElementById('filter-cmdr');
    if (!select) return;
    const previousVal = select.value;

    const cmdrs = new Set();
    LOGBOOK_ENTRIES.forEach(item => {
        if (item.cmdr && item.cmdr.trim() !== '') {
            cmdrs.add(item.cmdr.trim());
        }
    });

    select.innerHTML = '<option value="ALL">All Personnel</option>';
    Array.from(cmdrs).sort().forEach(cmdr => {
        const opt = document.createElement('option');
        opt.value = cmdr;
        opt.textContent = `CMDR ${cmdr.replace(/^CMDR\s+/i, '')}`;
        select.appendChild(opt);
    });

    if (cmdrs.has(previousVal) || previousVal === 'ALL') {
        select.value = previousVal;
    } else {
        select.value = 'ALL';
    }
}

function renderLogs() {
    const grid = document.getElementById('logs-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const selectedCmdr = document.getElementById('filter-cmdr').value;
    const sortOrder = document.getElementById('sort-order').value;

    let filtered = LOGBOOK_ENTRIES.filter(item => {
        if (selectedCmdr === 'ALL') return true;
        return (item.cmdr || '').trim().toLowerCase() === selectedCmdr.toLowerCase();
    });

    if (sortOrder === 'newest') {
        filtered.sort((a, b) => parseDateNum(b.date) - parseDateNum(a.date));
    } else if (sortOrder === 'oldest') {
        filtered.sort((a, b) => parseDateNum(a.date) - parseDateNum(b.date));
    }

    if (filtered.length === 0) {
        grid.innerHTML = '<div class="logs-empty">No expedition logbooks found matching filter criteria.</div>';
        return;
    }

    filtered.forEach(item => {
        const card = document.createElement('a');
        card.className = 'log-card';
        card.href = item.url || '#';
        card.target = '_blank';
        card.rel = 'noopener noreferrer';

        const cmdrLabel = item.cmdr ? `CMDR ${escapeHtml(item.cmdr.replace(/^CMDR\s+/i, ''))}` : 'Unlogged CMDR';
        const dateLabel = escapeHtml(item.date || 'Undated');
        const titleLabel = escapeHtml(item.title || 'Untitled Logbook Entry');
        const excerptLabel = escapeHtml(item.excerpt || 'Open full dispatch on Inara.');

        const bannerHtml = item.img && item.img.trim() !== ''
            ? `<img class="log-hero" src="${escapeHtml(item.img)}" alt="${titleLabel}" referrerpolicy="no-referrer" loading="lazy" onerror="this.outerHTML='<div class=\\'log-card-fallback\\'><img src=\\'nahla_voyage-sm.png\\' alt=\\'Seal\\'><span>Text Dispatch</span></div>'">`
            : `<div class="log-card-fallback"><img src="nahla_voyage-sm.png" alt="Seal"><span>Text Dispatch</span></div>`;

        card.innerHTML = `
            <div class="log-card-banner">
                ${bannerHtml}
            </div>
            <div class="log-card-body">
                <div class="log-meta">
                    <span class="log-cmdr">${cmdrLabel}</span>
                    <span>${dateLabel}</span>
                </div>
                <h3 class="log-title">${titleLabel}</h3>
                <p class="log-excerpt">${excerptLabel}</p>
                <div class="log-footer-link">
                    <span>INARA LOGBOOK</span>
                    <span>Read Entry &nearr;</span>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

// Optional CORS-proxy metadata helper inside Admin Modal
async function autoFetchInaraMeta() {
    const urlInput = document.getElementById('new-log-url').value.trim();
    const statusEl = document.getElementById('admin-fetch-status');
    if (!urlInput) {
        statusEl.style.color = '#ffbf00';
        statusEl.textContent = 'Paste an Inara URL first.';
        return;
    }

    statusEl.style.color = '#61dafb';
    statusEl.textContent = 'Querying Inara metadata via proxy...';

    try {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(urlInput)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error('Proxy error');
        const data = await res.json();
        if (!data || !data.contents) throw new Error('Empty response');

        const doc = new DOMParser().parseFromString(data.contents, 'text/html');
        const ogTitle = doc.querySelector('meta[property="og:title"]')?.content || doc.title || '';
        const ogDesc = doc.querySelector('meta[property="og:description"]')?.content || '';
        const ogImg = doc.querySelector('meta[property="og:image"]')?.content || '';

        if (!ogTitle && !ogDesc && !ogImg) {
            throw new Error('Blocked by Cloudflare');
        }

        if (ogTitle && !document.getElementById('new-log-title').value) {
            document.getElementById('new-log-title').value = ogTitle.replace(/\s*\|\s*INARA.*$/i, '').trim();
        }
        if (ogDesc && !document.getElementById('new-log-excerpt').value) {
            document.getElementById('new-log-excerpt').value = ogDesc.trim();
        }
        if (ogImg && !document.getElementById('new-log-img').value) {
            document.getElementById('new-log-img').value = ogImg.trim();
        }

        statusEl.style.color = '#8f9';
        statusEl.textContent = '✓ Metadata populated! Review fields below and click + Add Log Entry.';
    } catch (err) {
        statusEl.style.color = '#ffbf00';
        statusEl.textContent = 'Inara anti-bot protection blocked auto-fetch — fill in the fields manually below.';
    }
}

// Admin Modal Controls
function toggleAdminModal(show) {
    const modal = document.getElementById('admin-modal');
    if (show) {
        adminWorkingList = JSON.parse(JSON.stringify(LOGBOOK_ENTRIES));
        renderAdminList();
        modal.classList.add('active');
    } else {
        modal.classList.remove('active');
    }
}

function renderAdminList() {
    const list = document.getElementById('admin-item-list');
    list.innerHTML = '';

    adminWorkingList.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'admin-item-card';
        card.innerHTML = `
            <div class="admin-item-top">
                <input type="text" class="admin-input" value="${escapeHtml(item.url)}" placeholder="Inara URL" onchange="updateAdminItem(${idx}, 'url', this.value)">
                <input type="text" class="admin-input" value="${escapeHtml(item.cmdr || '')}" placeholder="CMDR" onchange="updateAdminItem(${idx}, 'cmdr', this.value)">
                <input type="text" class="admin-input" value="${escapeHtml(item.title)}" placeholder="Title" onchange="updateAdminItem(${idx}, 'title', this.value)">
                <input type="text" class="admin-input" value="${escapeHtml(item.date || '')}" placeholder="YYYY-MM-DD" onchange="updateAdminItem(${idx}, 'date', this.value)">
                <div class="admin-actions">
                    <button class="admin-btn-sm" onclick="moveAdminItem(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
                    <button class="admin-btn-sm" onclick="moveAdminItem(${idx}, 1)" ${idx === adminWorkingList.length - 1 ? 'disabled' : ''}>▼</button>
                    <button class="admin-btn-sm admin-btn-del" onclick="deleteAdminItem(${idx})">✕</button>
                </div>
            </div>
            <div class="admin-item-bot">
                <input type="text" class="admin-input" value="${escapeHtml(item.img || '')}" placeholder="Image URL (optional)" onchange="updateAdminItem(${idx}, 'img', this.value)">
                <input type="text" class="admin-input" value="${escapeHtml(item.excerpt || '')}" placeholder="Short excerpt" onchange="updateAdminItem(${idx}, 'excerpt', this.value)">
            </div>
        `;
        list.appendChild(card);
    });
}

function addNewLog() {
    const url = document.getElementById('new-log-url').value.trim();
    const img = document.getElementById('new-log-img').value.trim();
    const cmdr = document.getElementById('new-log-cmdr').value.trim();
    const title = document.getElementById('new-log-title').value.trim() || 'Untitled Logbook Entry';
    const excerpt = document.getElementById('new-log-excerpt').value.trim();
    let date = document.getElementById('new-log-date').value.trim();

    if (!date) {
        const now = new Date();
        const edYear = now.getUTCFullYear() + 1286;
        const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
        const dd = String(now.getUTCDate()).padStart(2, '0');
        date = `${edYear}-${mm}-${dd}`;
    }

    if (!url) return;

    adminWorkingList.push({ url, img, cmdr, title, excerpt, date });

    document.getElementById('new-log-url').value = '';
    document.getElementById('new-log-img').value = '';
    document.getElementById('new-log-cmdr').value = '';
    document.getElementById('new-log-title').value = '';
    document.getElementById('new-log-excerpt').value = '';
    document.getElementById('new-log-date').value = '';
    document.getElementById('admin-fetch-status').textContent = '';

    renderAdminList();
}

function updateAdminItem(index, key, val) {
    adminWorkingList[index][key] = val.trim();
}

function moveAdminItem(index, direction) {
    const target = index + direction;
    if (target < 0 || target >= adminWorkingList.length) return;
    const temp = adminWorkingList[index];
    adminWorkingList[index] = adminWorkingList[target];
    adminWorkingList[target] = temp;
    renderAdminList();
}

function deleteAdminItem(index) {
    if (!confirm(`Remove "${adminWorkingList[index].title}" from generated code?`)) return;
    adminWorkingList.splice(index, 1);
    renderAdminList();
}

function exportCodeForGitHub() {
    const formatted = 'let LOGBOOK_ENTRIES = ' + JSON.stringify(adminWorkingList, null, 4) + ';';

    navigator.clipboard.writeText(formatted).then(() => {
        const status = document.getElementById('admin-copy-status');
        status.classList.add('visible');
        setTimeout(() => status.classList.remove('visible'), 3000);
    });

    console.log(
        '%c[PROJECT NAHLA LOGBOOK EXPORT]\n' +
        '%cCopy and replace LOGBOOK_ENTRIES in nahla_logs.html:\n\n' + formatted,
        'color: #ffbf00; font-weight: bold;',
        'color: #61dafb;'
    );
}

// Global key controls
document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
        e.preventDefault();
        const modal = document.getElementById('admin-modal');
        toggleAdminModal(!modal.classList.contains('active'));
        return;
    }

    if (e.key === 'Escape') {
        const adminModal = document.getElementById('admin-modal');
        if (adminModal.classList.contains('active')) {
            toggleAdminModal(false);
        }
    }
});

// Boot sequence
refreshCmdrFilterDropdown();
renderLogs();
</script>
